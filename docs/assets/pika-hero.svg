<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc"><title id="title">Pika Note — Your thoughts, close at hand.</title><desc id="desc">Cream and carrot Pika branding beside the e-paper device. Voice memories, tasks, events and Ask, with an Android companion.</desc><rect width="1280" height="600" rx="36" fill="#f6f4ef"/><circle cx="78" cy="73" r="29" fill="#e9e5dc"/><circle cx="78" cy="73" r="15" fill="#ef573f"/><g fill="#22211f" font-family="Arial,Helvetica,sans-serif"><text x="124" y="83" font-size="27" font-weight="700" letter-spacing="-1">pika</text><text x="54" y="220" font-size="92" font-weight="700" letter-spacing="-5">Your thoughts,</text><text x="54" y="316" font-size="92" font-weight="700" letter-spacing="-5">close at hand.</text><text x="58" y="376" font-size="24" fill="#77736c">A little e-paper device. A capable Android companion.</text><path d="M58 421H770" stroke="#d9d4c9"/><text x="58" y="475" font-size="22" fill="#77736c">Speak. Remember. Plan. Ask.</text><rect x="58" y="515" width="164" height="37" rx="18.5" fill="#ef573f"/><text x="80" y="540" font-size="16" fill="#fff">PHONE + PIKA</text><text x="244" y="540" font-size="16" fill="#77736c">V8 · Preview</text></g><ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns1="http://www.inkscape.org/namespaces/inkscape" xmlns:ns2="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="350" height="459" viewBox="0 0 189.17708 247.91458" version="1.1" id="svg1" xml:space="preserve" ns1:version="1.4.3 (0d15f75, 2025-12-25)" ns2:docname="pika_case.svg" x="875" y="64"><ns2:namedview id="namedview1" pagecolor="#505050" bordercolor="#eeeeee" borderopacity="1" ns1:showpageshadow="0" ns1:pageopacity="0" ns1:pagecheckerboard="0" ns1:deskcolor="#505050" ns1:document-units="mm" ns1:zoom="1" ns1:cx="108.5" ns1:cy="480.5" ns1:window-width="3440" ns1:window-height="1372" ns1:window-x="-8" ns1:window-y="-8" ns1:window-maximized="1" ns1:curre