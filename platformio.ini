[platformio]
src_dir = pika_note
default_envs = pika_note_2

[env:pika_note_2]
extra_scripts = pre:tools/local_config.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_pika_8MB.csv
board_build.embed_txtfiles =
  certs/pika_ca_bundle.pem
  certs/weather_ca_bundle.pem
lib_deps =
  adafruit/Adafruit GFX Library@1.12.1
  bblanchon/ArduinoJson@7.4.2
  h2zero/NimBLE-Arduino@2.5.1
build_unflags = -D ARDUINO_USB_MODE=1
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D PIKA_PHONE_MODE=1
  -D PIKA_NOTE_VERSION=\"2.0.0-assistant-v8.0.6-pika-preview\"

; Set upload_port locally if automatic detection is unavailable.

