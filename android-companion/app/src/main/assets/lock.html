<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unlock Pika</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#302e29;font-family:Arial,sans-serif;min-height:100dvh;display:grid;place-items:center}.lock{width:min(340px,90vw);padding:32px 16px;text-align:center}.logo{width:64px;height:64px;border-radius:50%;background:#e9e4da;display:grid;place-items:center;margin:0 auto 24px}.logo:after{content:'';width:34px;height:34px;border-radius:50%;background:#ef573f}h1{font-size:34px;letter-spacing:-1px;margin:0 0 9px}.hint{font-size:13px;color:#8a8073;min-height:20px}.dots{display:flex;justify-content:center;gap:13px;margin:28px 0 36px}.dot{width:11px;height:11px;border:1.5px solid #c9bdae;border-radius:50%}.dot.on{background:#ef573f;border-color:#ef573f}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}button{border:0;border-radius:50%;width:70px;height:70px;justify-self:center;background:#e9e4da;color:#302e29;font:29px Arial;cursor:pointer;touch-action:manipulation}button{-webkit-tap-highlight-color:transparent;outline:none;user-select:none;-webkit-user-select:none}button:focus:not(:focus-visible){outline:none;box-shadow:none}button:active{background:#ef573f;color:white}button:focus-visible{outline:none;box-shadow:0 0 0 2px #ef573f}.erase{font-size:19px;background:transparent}.blank{visibility:hidden}.foot{margin-top:30px;font-size:11px;color:#968a7b}[data-theme="dark"] body{background:#222320;color:#f2eee5}[data-theme="dark"] button,[data-theme="dark"] .logo{background:#383a33;color:#f2eee5}[data-theme="dark"] .hint,[data-theme="dark"] .foot{color:#b0aca1}[data-theme="dark"] button:active{background:#f17a59;color:#211e19}[data-theme="dark"] .erase{background:transparent}</style><script src="/phone.js"></script><main class="lock"><div class="logo" aria-hidden="true"></div><h1>Welcome back.</h1><p class="hint" id="status" role="status">Enter your Pika PIN</p><div class="dots" id="dots" aria-label="PIN digits"></div><div class="keys"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><span class="blank"></span><button data-n="0">0</button><button class="erase" id="erase" aria-label="Delete last digit">⌫</button></div><p class="foot">Your notes. Your space.</p></main><script>let pin='',busy=false;const size=4;const dots=document.querySelector('#dots'),status=document.querySelector('#status');function paint(){dots.replaceChildren(...Array.from({length:size},(_,i)=>{const dot=document.createElement('span');dot.className='dot'+(i<pin.length?' on':'');return dot}));dots.setAttribute('aria-label',pin.length+' of '+size+' digits entered')}async function digit(n){if(busy||pin.length>=size)return;pin+=n;paint();if(pin.length!==size)return;busy=true;status.textContent='Unlocking…';try{const result=await fetch('/auth/unlock',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({pin})});if(result.ok){location.replace('/');return}status.textContent=result.status===503?'Use Connect above to pair with Pika first.':result.status===429?'Too many attempts. Try again in 30 seconds.':'Incorrect PIN. Try again.'}catch{status.textContent='Pika is unavailable. Try again.'}pin='';busy=false;paint()}document.addEventListener('click',e=>{const button=e.target.closest('button');if(button?.dataset.n)digit(button.dataset.n);if(button?.id==='erase'&&!busy){pin=pin.slice(0,-1);paint()}});document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key)){e.preventDefault();digit(e.key)}else if(e.key==='Backspace'&&!busy){e.preventDefault();pin=pin.slice(0,-1);paint()}});paint();</script></html>
