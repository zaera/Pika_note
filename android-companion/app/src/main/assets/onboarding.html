<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to Pika</title><style>:root{--paper:#f6f4ef;--surface:#e9e4da;--ink:#29251f;--muted:#77736c;--accent:#fa5438}[data-theme=dark]{--paper:#222320;--surface:#35362f;--ink:#eee9dd;--muted:#b0aca1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Arial,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:26px}.setup{width:min(100%,360px);text-align:center}.mark{width:90px;height:90px;border-radius:50%;background:var(--surface);display:grid;place-items:center;margin:0 auto 42px}.mark:after{content:'';width:46px;height:46px;border-radius:50%;background:var(--accent)}.searching .mark{animation:pulse 1.4s ease-in-out infinite}h1{font-size:38px;letter-spacing:-1.2px;margin:0 0 18px}p{line-height:1.6;color:var(--muted)}button{font:700 16px Arial;background:var(--accent);color:white;border:0;border-radius:26px;padding:15px 28px;min-width:160px;margin-top:24px;cursor:pointer}.steps{display:flex;gap:9px;justify-content:center;margin:35px 0 0}.steps span{width:7px;height:7px;background:var(--surface);border-radius:50%}.steps .active{background:var(--accent)}.slide{animation:enter .3s ease}@keyframes enter{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.55;transform:scale(.9)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="setup"><div class="mark" aria-hidden="true"></div><section id="slide" class="slide"></section><div class="steps"><span class="active"></span><span></span><span></span></div></main><script>document.documentElement.dataset.theme=PikaNative.theme();const pending=new Map();let sequence=0;window.__nativeDone=(id,status,base64)=>{const p=pending.get(id);if(!p)return;pending.delete(id);const text=new TextDecoder().decode(Uint8Array.from(atob(base64),c=>c.charCodeAt(0)));if(status>=400)p.reject(Error(JSON.parse(text).error||'Connection failed'));else p.resolve(JSON.parse(text))};function api(method='GET'){return new Promise((resolve,reject)=>{const id=String(++sequence);pending.set(id,{resolve,reject});PikaNative.request(id,'/api/phone/onboarding',method,method==='POST'?'{}':'')})}let step=0;function paint(){const box=document.getElementById('slide');box.classList.remove('slide');void box.offsetWidth;box.classList.add('slide');document.querySelectorAll('.steps span').forEach((n,i)=>n.classList.toggle('active',i===step));box.innerHTML=step===0?'<h1>Hello, Pika.</h1><p>Your thoughts, plans and conversations.<br>Let’s connect your device.</p><button id="next">Get started</button>':step===1?'<h1>Wake your Pika.</h1><p>Keep your new Pika nearby and awake. Its screen shows Pika_note and a pairing code.</p><button id="next">Find Pika</button>':'<h1>Meet your Pika.</h1><p id="pair-status">Looking for Pika…</p><p>Confirm Bluetooth pairing on Android and enter the six-digit code shown on Pika.</p><button id="retry">Try again</button>';document.body.classList.toggle('searching',step===2)}document.addEventListener('click',async e=>{if(e.target.id==='next'){step++;paint();if(step===2)try{await api('POST')}catch(error){document.getElementById('pair-status').textContent=error.message}}if(e.target.id==='retry')await api('POST')});setInterval(async()=>{if(step!==2)return;try{const result=await api();if(result.paired){location.replace('/');return}document.getElementById('pair-status').textContent=result.status}catch{}},1000);paint();</script></body></html>
