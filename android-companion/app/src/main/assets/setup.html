<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up Pika</title><style>
:root{--paper:#f6f4ef;--surface:#fffdfa;--ink:#29251f;--muted:#77736c;--accent:#fa5438;--line:#d9d4c9}[data-theme=dark]{--paper:#222320;--surface:#35362f;--ink:#eee9dd;--muted:#b0aca1;--line:#53544b}*{box-sizing:border-box}body{margin:0;padding:28px 24px;background:var(--paper);color:var(--ink);font:16px Arial,sans-serif}.setup{max-width:440px;margin:auto}.brand{display:flex;align-items:center;gap:10px;font-weight:800;margin:4px 0 35px}.mark{width:30px;height:30px;border-radius:50%;background:#e9e4da;display:grid;place-items:center}.mark:after{content:'';width:16px;height:16px;border-radius:50%;background:var(--accent)}h1{font-size:38px;letter-spacing:-1.2px;margin:12px 0 20px;line-height:1.05}p,li{color:var(--muted);line-height:1.55;font-size:14px}ol{padding-left:20px}li{margin:9px 0}a{color:var(--accent)}label{display:block;font-size:12px;color:var(--muted);margin:20px 0 8px}input,select,textarea{display:block;width:100%;font:16px Arial;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:48px}input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}input[type=file]{font-size:13px}button{font:700 15px Arial;border:0;border-radius:26px;padding:15px 22px;min-height:48px;color:white;background:var(--accent);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.actions{display:flex;gap:10px;margin:26px 0 12px}.actions button{flex:1}.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.back{padding:0;min-height:32px;background:transparent;color:var(--muted);font-size:13px}.progress{display:flex;gap:6px;margin:25px 0}.progress span{height:3px;flex:1;border-radius:4px;background:var(--line)}.progress .active{background:var(--accent)}#error{color:var(--accent);font-size:13px;line-height:1.5}#error:empty{display:none}#step-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}code{overflow-wrap:anywhere;font-size:12px}.slide{animation:enter .2s ease}@keyframes enter{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.slide{animation:none}}
</style></head><body><main class="setup"><div class="brand"><span class="mark"></span>pika</div><div id="step-label"></div><div class="progress" aria-hidden="true"></div><form id="setup-form"><section id="slide" class="slide"></section><p id="error" role="status"></p><div class="actions"><button type="button" class="secondary" id="skip">Skip</button><button type="submit" id="continue">Continue</button></div><button type="button" id="back" class="back">← Back</button></form></main><script src="/setup.js"></script></body></html>
